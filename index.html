<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Educational Magazine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CONFIG-DRIVEN THEME TOKENS
   Edit these variables to restyle the whole site.
   ============================================================ */
:root{
  --background:#f6f3ea;
  --surface:#ffffff;
  --surface-2:#eeeade;
  --text:#1b1a17;
  --muted:#6b6656;
  --accent:#1d3557;      /* ink blue */
  --accent-2:#e0a721;    /* editorial yellow */
  --border:#ddd6c4;
  --shadow: rgba(20,18,10,0.10);
 
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Source Sans 3', -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
 
  --maxw: 1180px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:#111014;
    --surface:#1a1a1f;
    --surface-2:#212127;
    --text:#f1efe6;
    --muted:#9b978a;
    --accent:#7fa6d9;
    --accent-2:#f0c14b;
    --border:#302f36;
    --shadow: rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --background:#111014;
  --surface:#1a1a1f;
  --surface-2:#212127;
  --text:#f1efe6;
  --muted:#9b978a;
  --accent:#7fa6d9;
  --accent-2:#f0c14b;
  --border:#302f36;
  --shadow: rgba(0,0,0,0.45);
}
 
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--background);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.55;
  transition:background .35s ease, color .35s ease;
  overflow-x:hidden;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0 0 .4em; font-weight:600; letter-spacing:-.01em;}
p{margin:0 0 1em;}
:focus-visible{outline:3px solid var(--accent-2); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  html{scroll-behavior:auto;}
}
 
/* ---------------- HEADER ---------------- */
.site-header{
  position:sticky; top:0; z-index:50;
  background:var(--background);
  border-bottom:1px solid var(--border);
}
.header-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; max-width:var(--maxw); margin:0 auto;
}
.brand{
  font-family:var(--font-display); font-weight:700; font-size:1.35rem;
  display:flex; align-items:baseline; gap:8px;
}
.brand .kicker{font-family:var(--font-body); font-weight:600; font-size:.62rem; letter-spacing:.14em; color:var(--accent-2); background:var(--text); color:var(--background); padding:2px 6px;}
nav.main-nav{display:flex; align-items:center; gap:28px;}
nav.main-nav a{font-size:.95rem; font-weight:600; position:relative; padding:4px 0;}
nav.main-nav a::after{
  content:""; position:absolute; left:0; right:100%; bottom:0; height:2px; background:var(--accent);
  transition:right .25s ease;
}
nav.main-nav a:hover::after, nav.main-nav a.active::after{right:0;}
.header-controls{display:flex; align-items:center; gap:10px;}
.pill-btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  padding:6px 12px; border-radius:999px; font-size:.82rem; font-weight:600;
}
.pill-btn:hover{border-color:var(--accent);}
.hamburger{display:none; flex-direction:column; gap:4px; background:none; border:none; padding:6px;}
.hamburger span{width:22px; height:2px; background:var(--text);}
.mobile-menu{display:none; flex-direction:column; border-top:1px solid var(--border); background:var(--background);}
.mobile-menu a{padding:14px 24px; border-bottom:1px solid var(--border); font-weight:600;}
.mobile-menu.open{display:flex;}
 
@media (max-width:840px){
  nav.main-nav{display:none;}
  .hamburger{display:flex;}
}
 
/* ---------------- HERO ---------------- */
.hero{
  padding:64px 0 48px;
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
.hero-inner{display:grid; grid-template-columns:1.2fr .8fr; gap:48px; align-items:center;}
.hero-eyebrow{font-size:.78rem; font-weight:700; letter-spacing:.14em; color:var(--accent); margin-bottom:14px;}
.hero h1{font-size:clamp(2.4rem, 5vw, 4.1rem); line-height:1.02; margin-bottom:.3em;}
.hero p.lede{font-size:1.15rem; color:var(--muted); max-width:46ch;}
.btn-primary{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--accent); color:var(--background); font-weight:700;
  padding:13px 24px; margin-top:18px; border:none; font-size:.95rem;
}
.btn-primary:hover{background:var(--text);}
.hero-figure{
  aspect-ratio:4/5; background:transparent; border:none;
  display:flex; align-items:center; justify-content:center; position:relative;
}
.hero-figure img{width:100%; height:100%; object-fit:contain;}
@media (max-width:400px){ .hero-inner{grid-template-columns:1fr;} .hero-figure{order:-1;} }
 
/* ---------------- IMAGE / MEDIA PLACEHOLDERS ---------------- */
.placeholder{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  background:repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 10px, var(--surface) 10px, var(--surface) 20px);
  color:var(--muted); font-size:.78rem; font-weight:600; letter-spacing:.03em;
  border:1px dashed var(--border); text-align:center; padding:12px; width:100%; height:100%;
}
.placeholder small{font-weight:400; font-size:.7rem; opacity:.8;}
 
/* ---------------- SECTION HEADINGS ---------------- */
.section{padding:56px 0;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-bottom:28px; border-bottom:2px solid var(--text); padding-bottom:10px;}
.section-head h2{font-size:1.9rem; margin:0;}
.section-head .see-all{font-size:.85rem; font-weight:700; color:var(--accent);}
 
/* ---------------- SUBJECTS GRID ---------------- */
.subjects-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media (max-width:960px){ .subjects-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:620px){ .subjects-grid{grid-template-columns:1fr;} }
 
.subject-card{
  background:transparent; border:none;
  display:flex; flex-direction:column; overflow:visible;
  transition:transform .2s ease, box-shadow .2s ease;
}
.subject-card:hover{transform:translateY(-4px);}
.subject-card .thumb{aspect-ratio:16/10; background:transparent;}
.subject-card .body{padding:18px 18px 20px; display:flex; flex-direction:column; flex:1;}
.subject-card .tag{font-size:.68rem; font-weight:700; letter-spacing:.1em; color:var(--accent-2); background:var(--surface-2); align-self:flex-start; padding:3px 8px; margin-bottom:10px;}
.subject-card .tag.pending{color:var(--muted);}
.subject-card h3{font-size:1.25rem; margin-bottom:.35em;}
.subject-card p{color:var(--muted); font-size:.92rem; flex:1;}
.card-link{font-weight:700; font-size:.86rem; color:var(--accent); margin-top:10px;}
.card-link:hover{text-decoration:underline;}
 
/* ---------------- BREADCRUMB / BACK ---------------- */
.crumbs{font-size:.82rem; color:var(--muted); margin-bottom:18px;}
.crumbs a:hover{text-decoration:underline;}
.back-link{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:.85rem; color:var(--accent); margin-bottom:22px;}
.back-link:hover{text-decoration:underline;}
 
/* ---------------- ARTICLE ---------------- */
.article-hero{border-bottom:1px solid var(--border); padding-bottom:32px; margin-bottom:32px;}
.article-eyebrow{font-size:.75rem; font-weight:700; letter-spacing:.14em; color:var(--accent);}
.article-hero h1{font-size:clamp(2rem,4vw,3rem); margin:.2em 0 .3em;}
.article-meta{display:flex; gap:18px; flex-wrap:wrap; color:var(--muted); font-size:.88rem;}
.article-body{max-width:74ch;}
.article-figure{aspect-ratio:16/9; background:transparent; border:none; margin:20px 0;}
.article-figure img{width:100%; height:100%; object-fit:contain;}
 
.status-note{
  background:var(--surface-2); border:1px dashed var(--border); padding:28px; text-align:center;
}
.status-note .big{font-family:var(--font-display); font-size:1.5rem; margin-bottom:.3em;}
 
/* two column panel: data + graph */
.panel-row{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin:24px 0;}
@media (max-width:760px){ .panel-row{grid-template-columns:1fr;} }
.data-panel{background:var(--surface); border:1px solid var(--border); padding:22px;}
.data-panel h4{font-size:.78rem; letter-spacing:.1em; color:var(--accent); margin-bottom:14px;}
.data-panel .row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-family:var(--font-display); font-size:1.05rem;}
.data-panel .row:last-child{border-bottom:none;}
.data-panel .row span:first-child{color:var(--muted); font-family:var(--font-body); font-size:.9rem;}
.graph-panel{background:transparent; border:none; min-height:220px;}
 
.solution-block{background:var(--surface); border:1px solid var(--border); padding:24px; margin:18px 0;}
.solution-block h4{font-size:.78rem; letter-spacing:.1em; color:var(--accent); margin-bottom:14px;}
.step-line{font-family:var(--font-display); font-size:1.15rem; margin:8px 0; padding-left:4px;}
.result-strip{display:flex; gap:16px; flex-wrap:wrap; margin:22px 0;}
.result-card{flex:1; min-width:180px; background:var(--text); color:var(--background); padding:22px; text-align:center;}
.result-card .num{font-family:var(--font-display); font-size:2.1rem; font-weight:700;}
.result-card .lbl{font-size:.72rem; letter-spacing:.12em; opacity:.75; margin-top:4px;}
.pull-quote{border-left:4px solid var(--accent-2); padding:6px 0 6px 20px; font-family:var(--font-display); font-size:1.3rem; margin:26px 0; font-style:italic;}
 
/* math typography */
.frac{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 .3em; font-family:var(--font-display);}
.frac .frac-num{border-bottom:2px solid currentColor; padding:0 .35em .08em;}
.frac .frac-den{padding:.08em .35em 0;}
.radical{display:inline-flex; align-items:flex-start; font-family:var(--font-display);}
.radical .rad-symbol{font-size:1.15em; line-height:1; transform:scaleY(1.35) translateY(2px); margin-right:1px;}
.radical .rad-inner{border-top:2px solid currentColor; padding:0 .18em; margin-top:1px;}
.math-line{font-family:var(--font-display); font-size:1.25rem; margin:10px 0;}
.math-block{background:var(--surface); border:1px solid var(--border); padding:26px; text-align:center; margin:20px 0; font-size:1.5rem;}
.answer-set{font-family:var(--font-display); font-size:1.2rem; background:var(--surface-2); display:inline-block; padding:10px 18px; margin-top:6px;}
 
/* media components */
.media-row{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:26px 0;}
@media (max-width:760px){ .media-row{grid-template-columns:1fr;} }
.media-box{background:var(--surface); border:1px solid var(--border); padding:20px;}
.media-box h4{font-size:.78rem; letter-spacing:.1em; color:var(--accent); margin-bottom:12px;}
.audio-player{display:flex; align-items:center; gap:12px; background:var(--surface-2); padding:10px 14px;}
.audio-player button{background:var(--text); color:var(--background); border:none; width:34px; height:34px; border-radius:50%; font-size:.9rem;}
.coming-soon{color:var(--muted); font-size:.88rem; font-style:italic;}
.qr-box{width:120px; height:120px; margin:0 auto;}
 
.sources-list{list-style:none; padding:0; margin:0;}
.sources-list li{border-bottom:1px solid var(--border); padding:10px 0; font-size:.92rem;}
 
/* ---------------- TEAM ---------------- */
.team-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:20px;}
@media (max-width:960px){ .team-grid{grid-template-columns:repeat(3,1fr);} }
@media (max-width:620px){ .team-grid{grid-template-columns:repeat(2,1fr);} }
.team-card{background:var(--surface); border:1px solid var(--border); text-align:center; padding:0 0 18px;}
.team-photo{aspect-ratio:1/1; background:transparent; margin-bottom:14px;}
.team-card h3{font-size:1.02rem; margin-bottom:.2em;}
.team-card .subj{color:var(--accent); font-size:.78rem; font-weight:700;}
.team-card .bio{color:var(--muted); font-size:.82rem; padding:0 12px;}
 
.map-list{list-style:none; padding:0; margin:0; display:grid; gap:10px;}
.map-list li{display:flex; gap:10px; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--border); font-size:.95rem;}
.map-list b{font-family:var(--font-display); min-width:180px;}
 
/* ---------------- ABOUT / 404 ---------------- */
.prose{max-width:70ch;}
.notfound{text-align:center; padding:90px 0;}
.notfound .code{font-family:var(--font-display); font-size:5rem; color:var(--accent-2);}
 
/* ---------------- FOOTER ---------------- */
.site-footer{border-top:1px solid var(--border); padding:44px 0 26px; margin-top:60px; background:var(--surface);}
.footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:30px; margin-bottom:26px;}
@media (max-width:760px){ .footer-grid{grid-template-columns:1fr 1fr;} }
.footer-grid h5{font-size:.72rem; letter-spacing:.1em; color:var(--muted); margin-bottom:12px;}
.footer-grid ul{list-style:none; padding:0; margin:0; display:grid; gap:8px; font-size:.9rem;}
.footer-bottom{border-top:1px solid var(--border); padding-top:18px; font-size:.8rem; color:var(--muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
 
/* reveal-on-load */
.fade-in{animation:fadeIn .5s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
</style>
</head>

function img(src, alt, extraClass, placeholderText){
  const ph = placeholderText || t('imageComingSoon');
  return `<div class="${extraClass||''}" style="width:100%;height:100%;">
    <img src="${src}" alt="${alt}" style="width:100%;height:100%;object-fit:contain;"
      onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',style:'width:100%;height:100%;',innerHTML:'&#128247;<br>${ph}<br><small>${src}</small>'}))">
  </div>`;
}
function frac(numHtml, denHtml){
  return `<span class="frac"><span class="frac-num">${numHtml}</span><span class="frac-den">${denHtml}</span></span>`;
}
function radical(innerHtml){
  return `<span class="radical"><span class="rad-symbol">&radic;</span><span class="rad-inner">${innerHtml}</span></span>`;
}
function mathFn(){
  return frac(radical('x&nbsp;+&nbsp;1'), 'x&nbsp;&minus;&nbsp;4');

/* handle audio play buttons generically after render */
function wireAudio(root){
  root.querySelectorAll('.audio-slot').forEach(slot=>{
    const src = slot.dataset.src;
    const test = new Audio();
    const btn = slot.querySelector('button');
    const label = slot.querySelector('span');
    btn.addEventListener('click', ()=>{
      const a = new Audio(src);
      a.play().catch(()=>{ label.textContent = t('audioComingSoon'); btn.disabled = true; });
      a.onerror = ()=>{ label.textContent = t('audioComingSoon'); btn.disabled = true; };
    });
  });
}

function physicsArticle(){
  const s = subjects.physics;
  return `
  <section class="section wrap">
    ${crumbs(s.name[lang])}
    <a href="#/subjects" class="back-link">&larr; ${t('backToMagazine')}</a>
    <div class="article-hero">
      <div class="article-eyebrow">${t('subjectsCrumb').toUpperCase()}</div>
      <h1>${lang==='en' ? 'Motion and Acceleration' : 'Movimiento y Aceleración'}</h1>
      <div class="article-meta"><span>${t('createdBy')}: ${s.responsible}</span></div>
    </div>
    <div class="article-body">
      <p>${lang==='en'
        ? '<strong>Problem:</strong> An automobile traveling at 20 m/s accelerates uniformly at a rate of 2 m/s&sup2; for 6 s.'
        : '<strong>Problema:</strong> Un automóvil que viaja a 20 m/s acelera uniformemente a razón de 2 m/s&sup2; durante 6 s.'}</p>
      <p>${lang==='en'
        ? 'a) Calculate the final velocity of the automobile.<br>b) Calculate the distance traveled during those 6 seconds.'
        : 'a) Calcular la velocidad final del automóvil.<br>b) Calcular la distancia recorrida durante esos 6 segundos.'}</p>
    </div>
 
    <div class="panel-row">
      <div class="data-panel">
        <h4>${t('given').toUpperCase()}</h4>
        <div class="row"><span>${lang==='en'?'Initial velocity':'Velocidad inicial'}</span><span>Vo = 20 m/s</span></div>
        <div class="row"><span>${lang==='en'?'Acceleration':'Aceleración'}</span><span>a = 2 m/s&sup2;</span></div>
        <div class="row"><span>${lang==='en'?'Time':'Tiempo'}</span><span>t = 6 s</span></div>
        <h4 style="margin-top:18px;">${t('unknown').toUpperCase()}</h4>
        <div class="row"><span>&nbsp;</span><span>Vf = ?</span></div>
        <div class="row"><span>&nbsp;</span><span>X = ?</span></div>
      </div>
      <div class="graph-panel">${img('images/grafica-fisica.png', t('graphPlaceholder'), '', t('graphPlaceholder'))}</div>
    </div>
 
    <div class="solution-block">
      <h4>${t('physicsSolution').toUpperCase()}</h4>
      <div class="step-line">a = (Vf &minus; Vo) / t</div>
      <div class="step-line">a &middot; t = Vf &minus; Vo</div>
      <div class="step-line">Vf = Vo + a &middot; t</div>
      <div class="step-line">Vf = 20 + (2)(6)</div>
      <div class="step-line"><strong>Vf = 32 m/s</strong></div>
    </div>
 
    <div class="solution-block">
      <h4>${lang==='en'?'DISTANCE':'DISTANCIA'}</h4>
      <div class="step-line">X = ((Vo + Vf)&middot;t) / 2</div>
      <div class="step-line">X = ((20 + 32)(6)) / 2</div>
      <div class="step-line">X = (52 &times; 6) / 2 = 312 / 2</div>
      <div class="step-line"><strong>X = 156 m</strong></div>
    </div>
 
    <div class="solution-block">
      <h4>${t('mathSubstitution').toUpperCase()}</h4>
      <p>${lang==='en'
        ? 'Using the final velocity obtained in the physical solution:'
        : 'Usando la velocidad final obtenida en la solución física:'}</p>
      <div class="step-line">Vf = 32 m/s</div>
      <p>${lang==='en'
        ? 'we substitute the values into the distance equation:'
        : 'sustituimos los valores en la ecuación de la distancia:'}</p>
      <div class="step-line">X = ((Vo + Vf)&middot;t) / 2</div>
      <div class="step-line">X = ((20 + 32)(6)) / 2</div>
      <div class="step-line"><strong>X = 156 m</strong></div>
    </div>
 
    <div class="result-strip">
      <div class="result-card"><div class="num">32 m/s</div><div class="lbl">${t('finalVelocity')}</div></div>
      <div class="result-card"><div class="num">156 m</div><div class="lbl">${t('distanceTraveled')}</div></div>
    </div>
 
    <blockquote class="pull-quote">
      ${lang==='en'
        ? '“The automobile traveled 156 m in 6 seconds and reached a final velocity of 32 m/s.”'
        : '“El automóvil recorrió 156 m en 6 s y alcanzó una velocidad final de 32 m/s.”'}
    </blockquote>
 
    <div class="media-row">
      ${audioBlock('audio/audio-physics.mp3', t('listenSection'))}
      ${qrBlock('images/qr-physics.png')}
    </div>
    <div class="media-row">
      ${videoBlock('video/video-physics.mp4')}
      ${sourcesBlock()}
    </div>
  </section>`;
}
 
function mathArticle(){
  const s = subjects.mathematics;
  return `
  <section class="section wrap">
    ${crumbs(s.name[lang])}
    <a href="#/subjects" class="back-link">&larr; ${t('backToMagazine')}</a>
    <div class="article-hero">
      <div class="article-eyebrow">${t('subjectsCrumb').toUpperCase()}</div>
      <h1>${lang==='en' ? 'Domain and Range of a Rational-Radical Function' : 'Dominio y Rango de una Función Racional-Radical'}</h1>
      <div class="article-meta"><span>${t('createdBy')}: ${s.responsible}</span></div>
    </div>
 
    <div class="solution-block" style="text-align:center;">
      <h4 style="text-align:left;">${t('functionLbl').toUpperCase()}</h4>
      <div class="math-block">f(x) = ${mathFn()}</div>
    </div>
 
    <div class="solution-block">
      <h4>${t('domain').toUpperCase()}</h4>
      <p>${lang==='en' ? 'The expression has a denominator that cannot equal zero:' : 'La expresión tiene un denominador que no puede ser cero:'}</p>
      <div class="math-line">x &minus; 4 &ne; 0 &nbsp;&rArr;&nbsp; x &ne; 4</div>
      <p>${lang==='en' ? 'The square root also requires a non-negative radicand:' : 'La raíz cuadrada también exige que el radicando no sea negativo:'}</p>
      <div class="math-line">x + 1 &ge; 0 &nbsp;&rArr;&nbsp; x &ge; &minus;1</div>
      <p>${lang==='en' ? 'Combining both conditions:' : 'Combinando ambas condiciones:'}</p>
      <div class="answer-set">${t('domain')}: [&minus;1, 4) &cup; (4, +&infin;)</div>
    </div>
 
    <div class="solution-block">
      <h4>${t('range').toUpperCase()}</h4>
      <p>${lang==='en'
        ? 'The range is not found the same way as the domain — it requires solving for x in terms of y and checking which y-values keep that x inside the domain.'
        : 'El rango no se obtiene de la misma manera que el dominio: es necesario despejar x en función de y y verificar qué valores de y mantienen ese x dentro del dominio.'}</p>
      <div class="math-line">y = ${mathFn()}</div>
      <p>${lang==='en'
        ? 'Since the square root in the numerator is always &ge; 0 for every x in the domain, y = 0 only when x = &minus;1. As x approaches 4, the denominator shrinks toward 0 and |y| grows without bound, while as x &rarr; +&infin;, y &rarr; 0&#8314; because the square root grows slower than x.'
        : 'Como la raíz del numerador siempre es &ge; 0 para todo x del dominio, y = 0 únicamente cuando x = &minus;1. Cuando x se acerca a 4, el denominador se reduce hacia 0 y |y| crece sin límite, mientras que cuando x &rarr; +&infin;, y &rarr; 0&#8314; porque la raíz crece más lento que x.'}</p>
      <p>${lang==='en' ? 'Analyzing the sign of the expression on each side of x = 4:' : 'Analizando el signo de la expresión a cada lado de x = 4:'}</p>
      <div class="math-line">${lang==='en'?'for &minus;1 &le; x &lt; 4':'para &minus;1 &le; x &lt; 4'}: y &le; 0</div>
      <div class="math-line">${lang==='en'?'for x &gt; 4':'para x &gt; 4'}: y &gt; 0</div>
      <div class="answer-set">${t('range')}: (&minus;&infin;, 0] &cup; (0, +&infin;)</div>
    </div>
 
    <div class="panel-row">
      <div class="graph-panel">${img('images/grafica-matematicas.png', t('graphPlaceholderMath'), '', t('graphPlaceholderMath'))}</div>
      <div class="data-panel">
        <h4>${t('finalAnswerLbl').toUpperCase()}</h4>
        <p style="font-size:.9rem; color:var(--muted);">${t('procedureLbl')}: ${lang==='en'?'root of numerator, exclusion of denominator, sign analysis.':'raíz del numerador, exclusión del denominador, análisis de signo.'}</p>
        <div class="row"><span>${t('domain')}</span><span>[&minus;1,4)&cup;(4,&infin;)</span></div>
        <div class="row"><span>${t('range')}</span><span>(&minus;&infin;,0]&cup;(0,&infin;)</span></div>
      </div>
    </div>
 
    <div class="media-row">
      ${audioBlock('audio/audio-math.mp3', t('listenSection'))}
      ${qrBlock('images/qr-mathematics.png')}
    </div>
    <div class="media-row">
      ${videoBlock('video/video-math.mp4')}
      ${sourcesBlock()}
    </div>
  </section>`;
}

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){
  const h = (location.hash || '#/').replace(/^#/, '');
  const parts = h.split('/').filter(Boolean);
  return parts;
}
function render(){
  const parts = parseHash();
  const app = document.getElementById('app');
  let html;
  let route = 'home';
  if(parts.length === 0){ html = viewHome(); route='home'; }
  else if(parts[0] === 'subjects'){ html = viewSubjects(); route='subjects'; }
  else if(parts[0] === 'subject' && parts[1]){ html = viewSubject(parts[1]); route='subjects'; }
  else if(parts[0] === 'team'){ html = viewTeam(); route='team'; }
  else if(parts[0] === 'about'){ html = viewAbout(); route='about'; }
  else { html = view404(); route=''; }
 
  app.innerHTML = `<div class="fade-in">${html}</div>`;
  wireAudio(app);
  updateStaticText();
  highlightNav(route);
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}
window.addEventListener('hashchange', render);
 
function highlightNav(route){
  document.querySelectorAll('[data-route]').forEach(a=>{
    a.classList.toggle('active', a.dataset.route === route);
  });
}
 
/* ============================================================
   STATIC TEXT (header/footer/nav) — re-applied on lang change
   ============================================================ */
function updateStaticText(){
  document.querySelectorAll('[data-route="home"]').forEach(a=>a.textContent = t('navHome'));
  document.querySelectorAll('[data-route="subjects"]').forEach(a=>a.textContent = t('navSubjects'));
  document.querySelectorAll('[data-route="team"]').forEach(a=>a.textContent = t('navTeam'));
  document.querySelectorAll('[data-route="about"]').forEach(a=>a.textContent = t('navAbout'));
  document.getElementById('f-brand-label').textContent = CONFIG.PROJECT_NAME.toUpperCase();
  document.getElementById('f-tagline').textContent = t('heroLede');
  document.getElementById('f-team-h').textContent = (lang==='en' ? 'TEAM' : 'EQUIPO');
  document.getElementById('f-nav-h').textContent = (lang==='en' ? 'NAVIGATION' : 'NAVEGACIÓN');
  document.getElementById('f-lang-h').textContent = (lang==='en' ? 'LANGUAGE' : 'IDIOMA');
  document.getElementById('f-theme-h').textContent = (lang==='en' ? 'THEME' : 'TEMA');
  document.getElementById('lang-toggle').textContent = lang.toUpperCase();
  document.title = CONFIG.PROJECT_NAME + ' — ' + (lang==='en' ? subjects.physics.name.en : subjects.physics.name.es);
}
 
/* ============================================================
   THEME + LANGUAGE TOGGLES
   ============================================================ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-toggle').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
  try{ localStorage.setItem('theme', theme); }catch(e){}
}
function applyLanguage(){
  document.documentElement.setAttribute('lang', lang);
  try{ localStorage.setItem('language', lang); }catch(e){}
}
document.getElementById('theme-toggle').addEventListener('click', ()=>{
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});
document.getElementById('lang-toggle').addEventListener('click', ()=>{
  lang = lang === 'en' ? 'es' : 'en';
  applyLanguage();
  render();
});

hamburger.addEventListener('click', ()=> mobileMenu.classList.toggle('open'));
mobileMenu.addEventListener('click', (e)=>{ if(e.target.tagName === 'A') mobileMenu.classList.remove('open'); });
 
/* ============================================================
   INIT
   ============================================================ */
applyTheme();
applyLanguage();
render();
